name: Deploy Hotel Kamal to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security & Integrity Verification
        run: npx tsx tests/p0-security.test.ts

      - name: Build Production Client
        run: npm run build

      - name: Prepare Deployment Bundle
        run: |
          mkdir -p release_bundle/tmp
          touch release_bundle/tmp/restart.txt

          # Copy compiled client dist
          cp -r dist release_bundle/

          # Copy server runtime
          cp -r server release_bundle/
          cp -r src release_bundle/
          cp package.json release_bundle/
          cp package-lock.json release_bundle/
          cp tsconfig.json release_bundle/
          cp vite.config.ts release_bundle/
          cp server.ts release_bundle/
          cp supabase_schema.sql release_bundle/
          
          # Copy cPanel htaccess if present
          if [ -f .htaccess ]; then
            cp .htaccess release_bundle/
          fi

          echo "Deployment bundle prepared successfully."

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_TARGET_DIR || 'public_html/' }}
          local-dir: release_bundle/
          protocol: ftps
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .kamal-pms.db*
